<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Visual feature grid</title>
  <defs>
    <pattern id="feature-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#fff3bf"/>
      <circle cx="12" cy="12" r="2.2" fill="#fff3bf"/>
    </pattern>
  </defs>
  <g fill="#eaaa00">
    <rect x="24" y="24" width="92" height="92" rx="15"/>
    <rect x="140" y="24" width="92" height="92" rx="15"/>
    <rect x="24" y="140" width="92" height="92" rx="15"/>
    <rect x="140" y="140" width="92" height="92" rx="15"/>
  </g>
  <g fill="url(#feature-dots)" opacity=".95">
    <rect x="34" y="34" width="72" height="72" rx="9"/>
    <rect x="150" y="34" width="72" height="72" rx="9"/>
    <rect x="34" y="150" width="72" height="72" rx="9"/>
    <rect x="150" y="150" width="72" height="72" rx="9"/>
  </g>
</svg>
